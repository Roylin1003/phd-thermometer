<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>國立臺灣師範大學華語文教學系畢業溫度計｜博士班修業進度</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@500;700;900&family=Noto+Sans+TC:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #efeae0;
    --paper-raised: #f7f4ec;
    --ink: #23281f;
    --ink-soft: #6b6a5b;
    --mercury: #a63328;
    --mercury-dim: #c98d85;
    --brass: #8b7355;
    --sage: #4b6353;
    --sage-bg: #e4e9e0;
    --line: #d3cbba;
    --locked: #b9b2a1;
  }
  :root:not([data-theme="light"]) {
    @media (prefers-color-scheme: dark) {
      --paper: #1c1a16; --paper-raised: #26241f; --ink: #ece7da; --ink-soft: #a29b88;
      --mercury: #d9685b; --mercury-dim: #7a3c35; --brass: #b39d7f; --sage: #8caa8a;
      --sage-bg: #2b3329; --line: #3c382f; --locked: #55503f;
    }
  }
  :root[data-theme="dark"] {
    --paper: #1c1a16; --paper-raised: #26241f; --ink: #ece7da; --ink-soft: #a29b88;
    --mercury: #d9685b; --mercury-dim: #7a3c35; --brass: #b39d7f; --sage: #8caa8a;
    --sage-bg: #2b3329; --line: #3c382f; --locked: #55503f;
  }

  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--paper); color: var(--ink); font-family: "Noto Sans TC", sans-serif; }
  body { min-height: 100vh; padding: 44px 22px 70px; }
  .wrap { max-width: 900px; margin: 0 auto; }

  header { margin-bottom: 30px; }
  h1 {
    font-family: "Noto Serif TC", serif; font-weight: 900;
    font-size: clamp(26px, 4.6vw, 36px); margin: 0 0 18px; letter-spacing: 0.01em;
  }

  .group-switch {
    display: inline-flex; border: 1px solid var(--line); border-radius: 999px;
    padding: 3px; gap: 3px; background: var(--paper-raised);
  }
  .group-switch button {
    font-family: "Noto Sans TC", sans-serif; font-size: 13.5px; font-weight: 500;
    border: none; background: transparent; color: var(--ink-soft);
    padding: 8px 18px; border-radius: 999px; cursor: pointer; transition: background 0.2s, color 0.2s;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .group-switch button.active { background: var(--mercury); color: var(--paper-raised); font-weight: 600; }
  @media (max-width: 640px) {
    .group-switch button { padding: 12px 18px; }
  }

  .mini-progress {
    display: none; position: sticky; top: 0; z-index: 5; align-items: center; gap: 10px;
    background: var(--paper); padding: 10px 4px; margin: 0 -4px; border-bottom: 1px solid var(--line);
    font-size: 12.5px; color: var(--ink-soft);
  }
  .mini-progress .mini-pct { font-family: "Noto Serif TC", serif; font-weight: 900; color: var(--mercury); font-size: 15px; }
  .mini-track { flex: 1; height: 6px; border-radius: 999px; background: var(--paper-raised); border: 1px solid var(--line); overflow: hidden; }
  .mini-fill { height: 100%; width: 0%; background: var(--mercury); transition: width 0.5s cubic-bezier(.4,0,.2,1); }
  @media (max-width: 640px) { .mini-progress { display: flex; } }

  .controls { display: flex; align-items: center; gap: 14px; flex-wrap: wrap; }
  .credits-field { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-soft); }
  .credits-field input {
    width: 56px; font-family: "Noto Sans TC", sans-serif; font-size: 13px; padding: 6px 8px;
    border: 1px solid var(--line); border-radius: 8px; background: var(--paper-raised); color: var(--ink); text-align: center;
  }
  .credits-field input:focus-visible { outline: 2px solid var(--mercury); outline-offset: 2px; }

  .years-note { margin-top: 10px; font-size: 12.5px; color: var(--ink-soft); }

  .board { display: grid; grid-template-columns: 190px 1fr; gap: 44px; align-items: start; }
  @media (max-width: 640px) {
    .board { grid-template-columns: 1fr; }
    .therm-col { order: 2; display: flex; justify-content: center; margin-top: 8px; }
    .list-col { order: 1; }
  }

  .therm-col { position: sticky; top: 40px; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  @media (max-width: 640px) { .therm-col { position: static; } }

  .reading { text-align: center; }
  .reading .num { font-family: "Noto Serif TC", serif; font-weight: 900; font-size: 42px; color: var(--mercury); line-height: 1; }
  .reading .frac { font-size: 12.5px; color: var(--ink-soft); margin-top: 4px; }

  .tube-frame { position: relative; width: 64px; height: 340px; }
  .tube {
    position: absolute; left: 50%; transform: translateX(-50%); bottom: 46px;
    width: 24px; height: 280px; border: 2px solid var(--brass); border-radius: 12px;
    background: var(--paper-raised); overflow: hidden;
  }
  .tube-fill { position: absolute; bottom: 0; left: 0; width: 100%; height: 0%; background: var(--mercury); transition: height 0.5s cubic-bezier(.4,0,.2,1); }
  .bulb { position: absolute; left: 50%; bottom: 0; transform: translateX(-50%); width: 52px; height: 52px; border-radius: 50%; border: 2px solid var(--brass); background: var(--paper-raised); }
  .bulb-fill { position: absolute; inset: 2px; border-radius: 50%; background: var(--mercury-dim); transition: background 0.4s; }
  .bulb-fill.active { background: var(--mercury); }

  .tick { position: absolute; left: 50%; transform: translateX(-50%); width: 30px; text-align: center; }
  .tick .line { width: 30px; height: 1px; background: var(--line); margin: 0 auto; }

  .milestone {
    font-size: 12px; color: var(--sage); background: var(--sage-bg); border-radius: 8px;
    padding: 7px 12px; text-align: center; line-height: 1.6; max-width: 200px; white-space: nowrap; opacity: 0; transition: opacity 0.4s;
  }
  .milestone.show { opacity: 1; }

  .reset-btn {
    background: none; border: 1px solid var(--line); color: var(--ink-soft);
    font-family: "Noto Sans TC", sans-serif; font-size: 11.5px; padding: 5px 13px;
    border-radius: 20px; cursor: pointer;
  }
  .reset-btn:hover { border-color: var(--mercury); color: var(--mercury); }

  .phase { margin-bottom: 28px; }
  .phase-title { font-family: "Noto Serif TC", serif; font-weight: 700; font-size: 15.5px; margin: 0 0 10px; }
  .phase-rule { height: 1px; background: var(--line); margin: 0 0 14px; }

  .item {
    display: grid; grid-template-columns: 24px 1fr; gap: 12px;
    padding: 10px 4px; border-bottom: 1px dashed var(--line); align-items: start;
    cursor: pointer; -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  .item:last-child { border-bottom: none; }
  .item.is-locked { cursor: not-allowed; }
  @media (max-width: 640px) { .item { padding: 14px 4px; } }

  .checkbox {
    width: 21px; height: 21px; border: 2px solid var(--brass); border-radius: 5px; margin-top: 2px;
    cursor: pointer; background: var(--paper-raised); position: relative; flex-shrink: 0;
    transition: background 0.2s, border-color 0.2s;
    -webkit-tap-highlight-color: transparent; touch-action: manipulation;
  }
  @media (max-width: 640px) { .checkbox { width: 24px; height: 24px; } }
  .checkbox.checked { background: var(--sage); border-color: var(--sage); }
  .checkbox.checked::after {
    content: ""; position: absolute; left: 5.5px; top: 1.5px; width: 6px; height: 11px;
    border: solid var(--paper); border-width: 0 2px 2px 0; transform: rotate(40deg);
  }
  @media (max-width: 640px) {
    .checkbox.checked::after { left: 6.5px; top: 2px; width: 7px; height: 13px; }
  }
  .checkbox.locked {
    cursor: not-allowed; border-color: var(--locked); opacity: 0.55;
    background: repeating-linear-gradient(135deg, var(--paper-raised), var(--paper-raised) 3px, var(--locked) 3px, var(--locked) 4px);
  }

  .item-body label { font-size: 14.5px; font-weight: 500; cursor: pointer; display: block; }
  .item.is-locked .item-body label { color: var(--ink-soft); cursor: not-allowed; }
  .item-meta { font-size: 12px; color: var(--ink-soft); margin-top: 2px; line-height: 1.55; }
  .clause { color: var(--brass); font-weight: 600; }
  .lock-note { font-size: 11.5px; color: var(--mercury); margin-top: 3px; }
  @media (max-width: 640px) {
    .item-body label { font-size: 16px; }
    .item-meta { font-size: 13px; }
    .phase-title { font-size: 17px; }
  }

  footer { margin-top: 44px; padding-top: 18px; border-top: 1px solid var(--line); font-size: 11.5px; color: var(--ink-soft); line-height: 1.8; }

  button:focus-visible, .checkbox:focus-visible { outline: 2px solid var(--mercury); outline-offset: 2px; }
</style>
</head>
<body>
<div class="wrap">

  <header>
    <h1>國立臺灣師範大學華語文教學系畢業溫度計</h1>
    <div class="controls">
      <div class="group-switch" role="group" aria-label="選擇組別">
        <button type="button" data-group="rnd">產學研發組</button>
        <button type="button" data-group="edu">華語文教學組</button>
      </div>
      <div class="credits-field">
        <label for="creditsInput">畢業學分需求</label>
        <input type="number" id="creditsInput" min="1" step="1">
        <span>學分</span>
      </div>
    </div>
    <div class="years-note" id="yearsNote"></div>
  </header>

  <div class="mini-progress" id="miniProgress">
    <span class="mini-pct" id="miniPct">0°</span>
    <span id="miniFrac">0 / 0 項完成</span>
    <div class="mini-track"><div class="mini-fill" id="miniFill"></div></div>
  </div>

  <div class="board">
    <div class="therm-col">
      <div class="reading">
        <div class="num" id="pct">0°</div>
        <div class="frac" id="frac"></div>
      </div>
      <div class="tube-frame">
        <div class="tube"><div class="tube-fill" id="tubeFill"></div></div>
        <div class="bulb"><div class="bulb-fill" id="bulbFill"></div></div>
        <div id="ticks"></div>
      </div>
      <div class="milestone" id="milestone">🎓 已具博士學位候選人資格</div>
      <button class="reset-btn" id="resetBtn" type="button">重設此組勾選</button>
    </div>

    <div class="list-col" id="listCol"></div>
  </div>

  <footer>
    依系上修業規定（112學年修訂版）整理，供進度自我檢查，不具正式效力，實際條件以系辦公告與正式規定為準。勾選狀態僅存於本機瀏覽器，各組資料分開儲存。
  </footer>

</div>

<script>
(function() {
  var GROUPS = {
    rnd: {
      name: "產學研發組",
      years: "修業年限 4–7 年",
      phases: [
        { title: "階段一 · 基礎建設", items: ["advisor","ethics","language","credits"] },
        { title: "階段二 · 資格審查", items: ["publication","qualifying"] },
        { title: "階段三 · 論文完成", items: ["proposal","practicum","defense"] }
      ],
      items: {
        advisor:     { label: "選定指導教授並簽署同意書", meta: "第一學期結束前完成", clause: "§6", deps: [] },
        ethics:      { label: "學術倫理測驗", meta: "簽署同意書當學期完成（105學年起入學適用）", clause: "§6", deps: ["advisor"] },
        language:    { label: "語文能力規定", meta: "外語認證或 TOCFL，依身份別", clause: "§5", deps: [] },
        credits:     { label: '修滿 <span class="credits-num">21</span> 學分', meta: "四課群任選三群，每群至少 1 門", clause: "§4", deps: [] },
        publication: { label: "發表論文 1 篇", meta: "第一作者・本系全銜・入學後發表", clause: "§7", deps: [] },
        qualifying:  { label: "資格考通過", meta: '先修畢 <span class="credits-num">21</span> 學分', clause: "§8", deps: ["credits"] },
        proposal:    { label: "研究計畫通過", meta: "須與產業合作單位實作研發相關", clause: "§7, §12–14", deps: ["qualifying","publication"] },
        practicum:   { label: "產業／法人實作研發", meta: "第 3–4 年進行，先修畢全部學分，須正式簽約單位", clause: "§19", deps: ["credits"] },
        defense:     { label: "學位論文考試通過", meta: "須與計畫通過跨學期申請", clause: "§16–17", deps: ["proposal"] }
      }
    },
    edu: {
      name: "華語文教學組",
      years: "修業年限 2–7 年",
      phases: [
        { title: "階段一 · 基礎建設", items: ["advisor","ethics","language","credits","lectures"] },
        { title: "階段二 · 資格審查", items: ["publication","qualifying"] },
        { title: "階段三 · 論文完成", items: ["proposal","practicum","defense"] }
      ],
      items: {
        advisor:     { label: "選定指導教授並簽署同意書", meta: "第三學期開始前完成", clause: "§6", deps: [] },
        ethics:      { label: "學術倫理測驗", meta: "簽署同意書當學期完成（105學年起入學適用）", clause: "§6", deps: ["advisor"] },
        language:    { label: "語文能力規定", meta: "外語認證或 TOCFL，依身份別", clause: "§5", deps: [] },
        credits:     { label: '修滿 <span class="credits-num">21</span> 學分', meta: "四課群任選三群，每群至少 1 門", clause: "§4", deps: [] },
        lectures:    { label: "學術演講／研討會出席", meta: "4 學期，每學期 ≥2 場研討會或 6 次演講", clause: "§4", deps: [] },
        publication: { label: "發表論文 1 篇", meta: "第一作者・本系全銜・入學後發表", clause: "§7", deps: [] },
        qualifying:  { label: "資格考通過", meta: '先修畢 <span class="credits-num">21</span> 學分', clause: "§8", deps: ["credits"] },
        proposal:    { label: "研究計畫通過", meta: "須先完成資格考、發表、演講出席", clause: "§12–14", deps: ["qualifying","publication","lectures"] },
        practicum:   { label: "海外實習", meta: "至少一學期，先送審實習計畫書", clause: "§18", deps: [] },
        defense:     { label: "學位論文考試通過", meta: "須與計畫通過跨學期申請", clause: "§16–17", deps: ["proposal"] }
      }
    }
  };

  var GROUP_KEY = "phd-therm-v2-group";
  var currentGroup = null;
  var state = { checked: {}, creditsRequired: 21 };

  function storeKey(g) { return "phd-therm-v2-" + g; }

  function loadGroupChoice() {
    try { return localStorage.getItem(GROUP_KEY); } catch (e) { return null; }
  }
  function saveGroupChoice(g) {
    try { localStorage.setItem(GROUP_KEY, g); } catch (e) {}
  }
  function loadState(g) {
    try {
      var raw = localStorage.getItem(storeKey(g));
      var parsed = raw ? JSON.parse(raw) : null;
      return {
        checked: (parsed && parsed.checked) ? parsed.checked : {},
        creditsRequired: (parsed && parsed.creditsRequired) ? parsed.creditsRequired : 21
      };
    } catch (e) { return { checked: {}, creditsRequired: 21 }; }
  }
  function saveState() {
    try { localStorage.setItem(storeKey(currentGroup), JSON.stringify(state)); } catch (e) {}
  }

  function order(g) {
    var out = [];
    GROUPS[g].phases.forEach(function(p) { p.items.forEach(function(id) { out.push(id); }); });
    return out;
  }

  function isUnlocked(g, id) {
    var deps = GROUPS[g].items[id].deps;
    if (!deps || !deps.length) return true;
    return deps.every(function(d) { return !!state.checked[d]; });
  }

  function buildList(g) {
    var host = document.getElementById("listCol");
    host.innerHTML = "";
    GROUPS[g].phases.forEach(function(phase) {
      var sec = document.createElement("div");
      sec.className = "phase";
      var title = document.createElement("div");
      title.className = "phase-title";
      title.textContent = phase.title;
      sec.appendChild(title);
      var rule = document.createElement("div");
      rule.className = "phase-rule";
      sec.appendChild(rule);

      phase.items.forEach(function(id) {
        var def = GROUPS[g].items[id];
        var item = document.createElement("div");
        item.className = "item";
        item.dataset.id = id;
        item.innerHTML =
          '<div class="checkbox" role="checkbox" aria-checked="false" tabindex="0"></div>' +
          '<div class="item-body">' +
            '<label>' + def.label + '</label>' +
            '<div class="item-meta">' + def.meta + ' · <span class="clause">' + def.clause + '</span></div>' +
            '<div class="lock-note" hidden></div>' +
          '</div>';
        sec.appendChild(item);
      });
      host.appendChild(sec);
    });

    host.querySelectorAll(".item").forEach(function(item) {
      var id = item.dataset.id;
      var box = item.querySelector(".checkbox");
      item.addEventListener("click", function() { toggle(id); });
      box.addEventListener("keydown", function(e) { if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(id); } });
    });
  }

  function toggle(id) {
    if (!isUnlocked(currentGroup, id)) return;
    state.checked[id] = !state.checked[id];
    render();
  }

  function render() {
    var g = currentGroup;
    var ord = order(g);
    var completed = 0;

    ord.forEach(function(id) {
      var item = document.querySelector('.item[data-id="' + id + '"]');
      if (!item) return;
      var box = item.querySelector(".checkbox");
      var unlocked = isUnlocked(g, id);
      var checked = !!state.checked[id];
      if (!unlocked && checked) { state.checked[id] = false; checked = false; }
      if (checked) completed++;

      box.classList.toggle("checked", checked && unlocked);
      box.classList.toggle("locked", !unlocked);
      box.setAttribute("aria-checked", checked && unlocked ? "true" : "false");
      item.classList.toggle("is-locked", !unlocked);

      var note = item.querySelector(".lock-note");
      var deps = GROUPS[g].items[id].deps;
      if (!unlocked) {
        note.hidden = false;
        note.textContent = "🔒 需先完成：" + deps.filter(function(d) { return !state.checked[d]; })
          .map(function(d) { return GROUPS[g].items[d].label; }).join("、");
      } else {
        note.hidden = true;
      }
    });

    var pct = Math.round((completed / ord.length) * 100);
    document.getElementById("pct").textContent = pct + "°";
    document.getElementById("frac").textContent = completed + " / " + ord.length + " 項完成";
    document.getElementById("tubeFill").style.height = pct + "%";
    document.getElementById("bulbFill").classList.toggle("active", completed > 0);
    document.getElementById("milestone").classList.toggle("show", !!state.checked.qualifying);
    document.getElementById("yearsNote").textContent = GROUPS[g].name + " · " + GROUPS[g].years;

    document.getElementById("miniPct").textContent = pct + "°";
    document.getElementById("miniFrac").textContent = completed + " / " + ord.length + " 項完成";
    document.getElementById("miniFill").style.width = pct + "%";

    document.querySelectorAll(".credits-num").forEach(function(el) { el.textContent = state.creditsRequired; });
    var input = document.getElementById("creditsInput");
    if (document.activeElement !== input) input.value = state.creditsRequired;

    buildTicks(ord.length);
    saveState();
  }

  function buildTicks(n) {
    var host = document.getElementById("ticks");
    host.innerHTML = "";
    var tubeHeight = 280, tubeBottom = 46, frameH = 340;
    for (var i = 0; i < n; i++) {
      var frac = (i + 1) / n;
      var y = tubeBottom + tubeHeight * (1 - frac);
      var tick = document.createElement("div");
      tick.className = "tick";
      tick.style.bottom = (frameH - y) + "px";
      tick.innerHTML = '<div class="line"></div>';
      host.appendChild(tick);
    }
  }

  function selectGroup(g) {
    currentGroup = g;
    saveGroupChoice(g);
    state.checked = loadState(g);
    document.querySelectorAll(".group-switch button").forEach(function(btn) {
      btn.classList.toggle("active", btn.dataset.group === g);
    });
    buildList(g);
    render();
  }

  document.querySelectorAll(".group-switch button").forEach(function(btn) {
    btn.addEventListener("click", function() { selectGroup(btn.dataset.group); });
  });
  document.getElementById("resetBtn").addEventListener("click", function() {
    state.checked = {};
    render();
  });
  document.getElementById("creditsInput").addEventListener("input", function(e) {
    var n = parseInt(e.target.value, 10);
    if (!isNaN(n) && n > 0) { state.creditsRequired = n; render(); }
  });

  selectGroup(loadGroupChoice() || "edu");
})();
</script>
</body>
</html>
